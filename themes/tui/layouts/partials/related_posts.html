{{- $related := .Site.RegularPages.Related . | first 3 -}}
{{- with $related -}}
<div class="related-posts">
    <h2 class="related-posts-header">Related Posts</h2>
    <ul>
        {{- range . -}}
          <li>
            <a href="{{ .RelPermalink }}"><span>{{ .Title }}</span></a>
            {{- if .Params.summary -}}
              <p class="related-summary">{{ .Params.summary }}</p>
            {{- end -}}
          </li>
        {{- end -}}
    </ul>
</div>
{{- end -}}
