name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TZ: America/Los_Angeles

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
      - name: Install Hugo
        run: |
          wget https://github.com/gohugoio/hugo/releases/download/v0.163.2/hugo_extended_0.163.2_linux-amd64.deb --output-document hugo.deb
          sudo dpkg -i hugo.deb
      - name: Build Site
        run: |
          hugo version
          hugo --minify --gc
      - name: Push to S3 and CloudFront
        run: |
          aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }} --delete
          # to serve *.php files as text/html
          aws s3 cp public/ s3://${{ secrets.S3_BUCKET_NAME }} --recursive \
            --exclude '*' --include '*.php' --exclude 'xmlrpc.php' \
            --content-type 'text/html; charset=utf-8'
          # to serve xmlrpc.php as text/plain
          aws s3 cp public/xmlrpc.php s3://${{ secrets.S3_BUCKET_NAME }}/xmlrpc.php \
            --content-type 'text/plain;charset=UTF-8'
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
